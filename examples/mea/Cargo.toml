[package]
name = "mea"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
description = "Smoke and capture CLI for mango-external-agents; not published"

[lints]
workspace = true

[[bin]]
name = "mea"
path = "src/main.rs"

[dependencies]
mango-agent-acp.workspace = true
mango-agent-claude.workspace = true
mango-agent-codex.workspace = true
# `mea` is the host here, so it takes the default launcher rather than writing one: it has no
# sandbox policy of its own to express.
mango-external-agents = { workspace = true, features = ["launcher-tokio", "stdio"] }

serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt-multi-thread", "time"] }
