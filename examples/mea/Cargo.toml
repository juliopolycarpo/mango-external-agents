[package]
name = "mea"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
description = "Smoke and capture CLI for mango-external-agents; not published"

[lints]
workspace = true

[[bin]]
name = "mea"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
clap = { workspace = true, features = ["derive"] }
mango-agent-acp.workspace = true
mango-agent-claude.workspace = true
# The Unix socket transport is a feature of the harness, declared on Unix only: a build elsewhere
# still refuses `--transport unix-socket` through the descriptor.
mango-agent-codex = { workspace = true, features = ["unix-socket"] }
# `mea` is the host here, so it takes the default launcher rather than writing one: it has no
# sandbox policy of its own to express.
mango-external-agents = { workspace = true, features = ["launcher-tokio", "stdio"] }

# The fixture digests are SHA-256, from the crypto this workspace already ships: TLS is `ring`
# everywhere, so hashing a captured file adds a call rather than a dependency.
ring = { workspace = true, features = ["std"] }

serde_json = { workspace = true, features = ["std"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
# `mea turn --cancel-after` is driven end to end against the scripted ACP agent.
mango-agent-acp = { workspace = true, features = ["testing"] }
# `mea turn --json-schema` is driven end to end against the scripted Claude CLI.
mango-agent-claude = { workspace = true, features = ["testing"] }
mango-external-agents = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
