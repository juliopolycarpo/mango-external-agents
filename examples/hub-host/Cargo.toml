[package]
name = "hub-host"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
description = "Reference host proving the library's host-owned retry contract is executable; not published"

[lints]
workspace = true

[lib]
# The library has no benchmarks of its own, so `cargo bench` skips its unit tests.
bench = false

[dependencies]
async-trait.workspace = true
mango-external-agents.workspace = true
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
mango-external-agents = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

# Non-gating benchmark: a plain `harness = false` binary; see docs/benchmarks.md.
[[bench]]
name = "retry"
harness = false
