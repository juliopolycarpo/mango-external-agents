name: PR title

# The squash subject is the pull request title, and git-cliff builds CHANGELOG.md and the release
# notes from that subject. A title without a Conventional Commit type therefore costs the release
# an entry, which is how v0.1.0's notes came to omit the pull request that produced the tagged tree.
#
# Separate from ci.yml so that editing a title or description re-runs this check alone rather than
# the three-OS test matrix. Being its own workflow, its job is not part of ci.yml's `Gate`: the
# branch ruleset has to require the `Title reads as a commit subject` context by name, or a red
# check here still merges. `docs/releasing.md` records that alongside the squash-title setting the
# check depends on.

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  title:
    name: Title reads as a commit subject
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The base branch, not the pull request's own tree: a gate a pull request can edit is not a
      # gate. Checking out the head would let a branch relax the script, or add a scope to
      # AGENTS.md, and pass itself. The cost is that a pull request introducing a new scope cannot
      # use it in its own title until that change is on main, which is the right way round for a
      # release gate. The branch tip rather than `base.sha`, which is the base as recorded when the
      # pull request last synchronised: a branch opened before this gate landed would carry a base
      # without the script and take the bootstrap exit below, reporting green without checking.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.ref }}
      # Through the environment, never interpolated into the script: a title is attacker-controlled
      # text on a fork pull request.
      - env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Reachable only from the pull request that adds the script, when no base has it yet.
          # `-f`, not `-x`: a script that lost its mode bit has to fail loudly, not exit 0 here.
          if [ ! -f scripts/check-pr-title.sh ]; then
            echo "$BASE_REF has no scripts/check-pr-title.sh;"
            echo "this is the pull request that introduces it, so there is nothing to check against"
            exit 0
          fi
          scripts/check-pr-title.sh "$PR_TITLE"
