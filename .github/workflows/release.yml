name: Release

# Cut a release from a signed v* tag: verify GitHub reports the tag as signed,
# verify the manifests agree with the tag, require that the CI workflow passed on main for that
# exact commit, run the publication gate and the isolated minimum-Rust feature checks, publish the
# four crates to crates.io in dependency order
# through crates.io trusted publishing (OIDC, no stored token), and create a
# GitHub release with git-cliff notes. The publish job runs in the `release`
# environment, whose deployment rule admits only v* tags.
#
# The `mea` binary is a smoke tool, not a distribution; no release assets yet.

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-canary*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release without the leading v (e.g. 0.1.0); the ref must be its tag"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # Dependency order; a crate is published only after everything it depends on.
  CRATES: mango-external-agents mango-agent-claude mango-agent-codex mango-agent-acp

jobs:
  verify:
    name: Verify tag and manifests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `actions: read` lets the CI check list the workflow runs of this commit. A job's own
    # `permissions` replaces the workflow's, so `contents: read` is restated.
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: resolve
        name: Resolve the version from the tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          version=$(scripts/release-version.sh "$RELEASE_REF" "$INPUT_VERSION")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # An unsigned, lightweight or unverifiable tag, one signed under another name, or one that no
      # longer points at the commit this run was started for, stops here before anything is
      # published. This proves GitHub verified the tag's signature, not who signed it: pushing a v*
      # tag stays a matter of repository write access and the `release` environment.
      - name: Tag is signed and verified by GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.resolve.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: scripts/check-release-tag-signature.sh "$REPOSITORY" "$VERSION" "$RELEASE_COMMIT"
      # scripts/check.sh is not run again here: every line of it is a step of ci.yml, which ran on
      # the push that put this commit on main. `Gate` is not a required status check (issue #498),
      # so a commit can reach main with CI red; this asks GitHub whether the CI run of this exact
      # commit completed with every job green, and refuses when there is none, it is still
      # running, or it failed or was cancelled. Rerun the release once CI has finished.
      - name: CI passed on main for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: scripts/check-release-ci.sh "$REPOSITORY" "$RELEASE_COMMIT"
      # A cache saved on a tag ref can be restored by that tag alone, so this job saves none and
      # restores the one ci.yml's `rust` job saves on main. The key hashes every installed
      # toolchain, so the pinned one is installed first, as in that job, and the step runs before
      # the minimum toolchain is added.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust
          save-if: false
      # The compiler comes from `rust-version` in Cargo.toml through the script that checks it, as in
      # ci.yml's MSRV job, so the release cannot drift from the declared minimum. Installing it does
      # not select it: the steps below keep the toolchain pinned in rust-toolchain.toml, and only
      # check-features.sh asks cargo for the minimum by name.
      - name: Install the declared minimum toolchain
        run: rustup toolchain install "$(scripts/check-features.sh --print-toolchain)" --profile minimal
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest,cargo-hack,cargo-deny
      - name: Manifests match the tag
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: scripts/check-versions.sh "$VERSION"
      # The one thing the CI run checked above cannot answer: its `cargo deny` read the advisory
      # database when it ran on main, and an advisory published since then is only seen here. Bans,
      # licences and sources are fixed by the commit, so CI's answer for them stands.
      - name: No open advisories at release time
        run: cargo deny check advisories
      # The same gate a maintainer runs before the tag exists. It wraps the workspace dry run and
      # adds what that cannot answer: that the publishable set is still exactly $CRATES, and that
      # every tarball carries its README and licence and no build, scratch or environment path.
      # CI runs none of it. Running the bare dry run here instead would let a tag pass a check the
      # gate rejects. It runs the extracted packages' tests, which is why cargo-nextest is installed.
      - name: Publication gate
        run: scripts/check-publish.sh --list
      # One package at a time, so no other member can switch a feature on for it: bare core, each
      # public feature alone, all features, and the harness crates without defaults. The CI run
      # checked above builds the whole workspace on the pinned toolchain, and its MSRV job runs this
      # same script; it is kept here so a release does not rest on that job alone. A tag that fails
      # here publishes nothing.
      - name: Isolated feature checks on the declared minimum
        run: scripts/check-features.sh msrv --locked

  crates:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust
          save-if: false
      - id: pending
        name: Which crates are not on crates.io yet?
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          pending=""
          for crate in $CRATES; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' \
              -A 'mango-external-agents release workflow (github.com/juliopolycarpo/mango-external-agents)' \
              "https://crates.io/api/v1/crates/$crate/$VERSION")
            case "$status" in
              200) echo "$crate $VERSION is already on crates.io; skipping" ;;
              404) pending="$pending $crate" ;;
              *) echo "expected crates.io status 200 or 404 for $crate, received $status" >&2; exit 1 ;;
            esac
          done
          echo "list=${pending# }" >> "$GITHUB_OUTPUT"
      # The token exchange fails outright while a crate has no trusted-publishing
      # config, which is exactly the state of a first version published by hand
      # (crates.io accepts the config only once the crate exists). Ask for a token
      # only when there is something left to publish.
      - id: auth
        if: steps.pending.outputs.list != ''
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish in dependency order
        if: steps.pending.outputs.list != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          PENDING: ${{ steps.pending.outputs.list }}
          # `.cargo/config.toml` holds new crate versions for three days (Cargo 1.100+). Each
          # crate is verified against crates.io, where the sibling published a minute earlier is
          # not in Cargo.lock, so the hold would refuse it ("is too new") and strand the release.
          CARGO_RESOLVER_INCOMPATIBLE_PUBLISH_AGE: allow
        # cargo waits for each published crate to be resolvable before returning,
        # so the next crate in the list can depend on it without a sleep.
        run: |
          for crate in $PENDING; do
            echo "::group::cargo publish -p $crate"
            cargo publish -p "$crate" --locked
            echo "::endgroup::"
          done

  github-release:
    name: GitHub release
    needs: [verify, crates]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: git-cliff
      - name: Release notes for this tag
        run: git-cliff --config cliff.toml --current --strip header --output release-notes.md
      # The step still runs on a full rerun; only creating the release is skipped when it exists.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: scripts/publish-github-release.sh "$VERSION" release-notes.md
