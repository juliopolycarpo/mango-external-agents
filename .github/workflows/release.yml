name: Release

# Cut a release from a signed v* tag: verify the manifests agree with the tag,
# run the check lane, publish the four crates to crates.io in dependency order
# through crates.io trusted publishing (OIDC, no stored token), and create a
# GitHub release with git-cliff notes. The publish job runs in the `release`
# environment, whose deployment rule admits only v* tags.
#
# The `mea` binary is a smoke tool, not a distribution; no release assets yet.

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-canary*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release without the leading v (e.g. 0.1.0); the ref must be its tag"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # Dependency order; a crate is published only after everything it depends on.
  CRATES: mango-external-agents mango-agent-claude mango-agent-codex mango-agent-acp

jobs:
  verify:
    name: Verify tag and manifests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: resolve
        name: Resolve the version from the tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          version=$(scripts/release-version.sh "$RELEASE_REF" "$INPUT_VERSION")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          tool: cargo-nextest,cargo-deny,dprint
      - name: Manifests match the tag
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: scripts/check-versions.sh "$VERSION"
      - run: scripts/check.sh
      # The same gate a maintainer runs before the tag exists. It wraps the workspace dry run and
      # adds what that cannot answer: that the publishable set is still exactly $CRATES, and that
      # every tarball carries its README and licence and no build, scratch or environment path.
      # Running the bare dry run here instead would let a tag pass a check the gate rejects.
      - name: Publication gate
        run: scripts/check-publish.sh --list

  crates:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - id: pending
        name: Which crates are not on crates.io yet?
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          pending=""
          for crate in $CRATES; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' \
              -A 'mango-external-agents release workflow (github.com/juliopolycarpo/mango-external-agents)' \
              "https://crates.io/api/v1/crates/$crate/$VERSION")
            case "$status" in
              200) echo "$crate $VERSION is already on crates.io; skipping" ;;
              404) pending="$pending $crate" ;;
              *) echo "expected crates.io status 200 or 404 for $crate, received $status" >&2; exit 1 ;;
            esac
          done
          echo "list=${pending# }" >> "$GITHUB_OUTPUT"
      # The token exchange fails outright while a crate has no trusted-publishing
      # config, which is exactly the state of a first version published by hand
      # (crates.io accepts the config only once the crate exists). Ask for a token
      # only when there is something left to publish.
      - id: auth
        if: steps.pending.outputs.list != ''
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish in dependency order
        if: steps.pending.outputs.list != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          PENDING: ${{ steps.pending.outputs.list }}
        # cargo waits for each published crate to be resolvable before returning,
        # so the next crate in the list can depend on it without a sleep.
        run: |
          for crate in $PENDING; do
            echo "::group::cargo publish -p $crate"
            cargo publish -p "$crate" --locked
            echo "::endgroup::"
          done

  github-release:
    name: GitHub release
    needs: [verify, crates]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          tool: git-cliff
      - name: Release notes for this tag
        run: git-cliff --config cliff.toml --current --strip header --output release-notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          case "$VERSION" in *-*) prerelease=--prerelease ;; *) prerelease= ;; esac
          gh release create "v$VERSION" --title "v$VERSION" --notes-file release-notes.md $prerelease
