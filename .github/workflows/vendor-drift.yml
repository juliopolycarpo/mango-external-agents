name: Vendor contract drift

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: vendor-drift-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CLAUDE_VERSION: 2.1.270
  CODEX_VERSION: 0.154.0
  OPENCODE_VERSION: 1.18.30

jobs:
  pinned:
    name: Pinned public contracts (${{ matrix.os }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: vendor-contracts-${{ matrix.os }}
      - name: Install the pinned vendor CLIs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bin_dir="$RUNNER_TEMP/vendor-bin"
          scripts/install-vendor-cli.sh claude "$CLAUDE_VERSION" "$bin_dir"
          scripts/install-vendor-cli.sh codex "$CODEX_VERSION" "$bin_dir"
          scripts/install-vendor-cli.sh opencode "$OPENCODE_VERSION" "$bin_dir"
          echo "$bin_dir" >> "$GITHUB_PATH"
      - name: Reproduce the public contracts
        run: |
          capture_dir=$(mktemp -d)
          cargo run --locked -p mea -- capture --harness claude --out "$capture_dir/claude"
          scripts/check-vendor-contract.sh claude fixtures/claude/contract "$capture_dir/claude/contract"
          mkdir -p "$capture_dir/codex-expected/schema"
          cp -R fixtures/codex/contract "$capture_dir/codex-expected/contract"
          cp crates/mango-agent-codex/vendor/schema.json "$capture_dir/codex-expected/schema/schema.json"
          cargo run --locked -p mea -- capture --harness codex --out "$capture_dir/codex"
          scripts/vendor-codex.sh "$CODEX_VERSION" --out "$capture_dir/codex/schema"
          rm -f "$capture_dir/codex/schema/PIN"
          scripts/check-vendor-contract.sh codex "$capture_dir/codex-expected" "$capture_dir/codex"
          cargo run --locked -p mea -- capture --harness acp:opencode --out "$capture_dir/acp/opencode"
          scripts/check-vendor-contract.sh acp-opencode fixtures/acp/opencode/contract "$capture_dir/acp/opencode/contract"

  latest:
    name: Latest public contract (${{ matrix.vendor }})
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        vendor: [claude, codex, acp-opencode]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: vendor-contracts-latest
      - name: Install the latest vendor CLI
        id: install
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bin_dir="$RUNNER_TEMP/vendor-bin"
          case "${{ matrix.vendor }}" in
            claude) scripts/install-vendor-cli.sh claude latest "$bin_dir" ;;
            codex) scripts/install-vendor-cli.sh codex latest "$bin_dir" ;;
            acp-opencode) scripts/install-vendor-cli.sh opencode latest "$bin_dir" ;;
          esac
          echo "$bin_dir" >> "$GITHUB_PATH"
      - name: Watch the Claude --bare reference
        id: bare-reference
        if: matrix.vendor == 'claude' && steps.install.outcome == 'success'
        continue-on-error: true
        run: scripts/check-claude-bare-reference.sh
      - name: Capture the latest public contract
        id: capture
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          capture_dir="$RUNNER_TEMP/vendor-contract"
          mkdir -p "$capture_dir"
          case "${{ matrix.vendor }}" in
            claude) cargo run --locked -p mea -- capture --harness claude --out "$capture_dir/claude" ;;
            codex)
              mkdir -p "$capture_dir/expected/schema"
              cp -R fixtures/codex/contract "$capture_dir/expected/contract"
              cp crates/mango-agent-codex/vendor/schema.json "$capture_dir/expected/schema/schema.json"
              cargo run --locked -p mea -- capture --harness codex --out "$capture_dir/observed"
              scripts/vendor-codex.sh "$(codex --version | awk '{print $NF}')" --out "$capture_dir/observed/schema"
              rm -f "$capture_dir/observed/schema/PIN"
              ;;
            acp-opencode) cargo run --locked -p mea -- capture --harness acp:opencode --out "$capture_dir/acp/opencode" ;;
          esac
      - name: Open or update drift issues
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report_dir="$RUNNER_TEMP/vendor-drift-reports"
          vendor="${{ matrix.vendor }}"
          report="$report_dir/$vendor.md"
          if [ "${{ steps.install.outcome }}" != 'success' ]; then
            scripts/write-vendor-drift-report.sh --failure "$vendor" 'native CLI installation' "$report"
            scripts/upsert-vendor-drift-issue.sh "$GITHUB_REPOSITORY" "$vendor" "$report"
            exit 0
          fi
          if [ "$vendor" = 'claude' ] && [ "${{ steps.bare-reference.outcome }}" != 'success' ]; then
            scripts/write-vendor-drift-report.sh --failure "$vendor" 'the documented --bare default reference watch' "$report"
            scripts/upsert-vendor-drift-issue.sh "$GITHUB_REPOSITORY" "$vendor" "$report"
            exit 0
          fi
          if [ "${{ steps.capture.outcome }}" != 'success' ]; then
            scripts/write-vendor-drift-report.sh --failure "$vendor" 'public contract capture' "$report"
            scripts/upsert-vendor-drift-issue.sh "$GITHUB_REPOSITORY" "$vendor" "$report"
            exit 0
          fi

          case "$vendor" in
            claude)
              committed='fixtures/claude/contract'
              observed="$RUNNER_TEMP/vendor-contract/claude/contract"
              ;;
            codex)
              committed="$RUNNER_TEMP/vendor-contract/expected"
              observed="$RUNNER_TEMP/vendor-contract/observed"
              ;;
            acp-opencode)
              committed='fixtures/acp/opencode/contract'
              observed="$RUNNER_TEMP/vendor-contract/acp/opencode/contract"
              ;;
          esac
          if scripts/write-vendor-drift-report.sh "$vendor" "$committed" "$observed" "$report"; then
            echo "no $vendor drift"
            exit 0
          else
            status=$?
          fi
          if [ "$status" -ne 1 ]; then
            echo "could not compare $vendor public contract" >&2
            exit "$status"
          fi
          scripts/upsert-vendor-drift-issue.sh "$GITHUB_REPOSITORY" "$vendor" "$report"
