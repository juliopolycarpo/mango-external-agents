name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          tool: cargo-hack,cargo-nextest
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --no-default-features --locked -- -D warnings
      - run: cargo hack clippy --feature-powerset --depth 2 --all-targets --locked -p mango-external-agents -- -D warnings
      - run: cargo nextest run --workspace --all-features --locked
      - run: cargo test --doc --workspace --all-features --locked
      - run: cargo doc --no-deps --workspace --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: scripts/check-tls.sh
      - run: scripts/check-standalone.sh

  policy:
    name: Policy (deny, versions, docs format)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          tool: cargo-deny,dprint,git-cliff
      - run: cargo deny check
      - run: scripts/check-versions.sh
      - run: scripts/test-consumer-pin.sh
      - run: scripts/test-fresh-receipt.sh
      - run: scripts/test-release.sh
      - run: scripts/test-vendor-drift.sh
      - run: scripts/check-dev-dependencies.sh
      - run: scripts/check-bench-runner.sh
      - run: scripts/test-bench-runner.sh
      - run: dprint check

  msrv:
    name: MSRV (1.97)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The compiler comes from `rust-version` in Cargo.toml, so the lane cannot drift from the
      # declared minimum. 1.96.0 is only the historical registry consumer's own compiler.
      - name: Install the declared minimum toolchain
        run: |
          toolchain=$(scripts/check-msrv-features.sh --print-toolchain)
          echo "MSRV_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          rustup toolchain install "$toolchain" 1.96.0 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv
      # Every workspace member at once, so Cargo unifies features across them: this proves the
      # workspace builds at the minimum, not that any one crate does with only its own features.
      - run: cargo +"$MSRV_TOOLCHAIN" build --workspace --all-features --locked
      # One package at a time, so no other member can switch a feature on for it: bare core, each
      # public feature alone, all features, and the harness crates without defaults.
      - run: scripts/check-msrv-features.sh --locked
      # The current registry consumer: the published release from crates.io only, own manifest and
      # lock, no path dependency, running the lifecycle tests on the declared minimum compiler. It
      # is evidence for the release the pin names, not for the unpublished code in this checkout.
      - run: RUSTUP_TOOLCHAIN="$MSRV_TOOLCHAIN" scripts/check-standalone.sh --test-only current
      # HISTORICAL control. It pins the =0.3.1 crates and declares its own older minimum, so it is
      # checked with the compiler it names. It says nothing about 0.4.x or about this checkout.
      - run: cargo +1.96.0 check --manifest-path tests/standalone-historical/Cargo.toml --all-targets --all-features --locked

  # The `cfg(windows)` dependency edges are compiled by no Linux lane: `process-wrap`, `win32job` and
  # `windows` behind the core's `launcher-tokio`. A workspace `check` at the minimum reaches all of
  # them; the per-package feature matrix runs once on Linux above.
  msrv-windows:
    name: MSRV (1.97, windows-latest)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the declared minimum toolchain
        run: |
          toolchain=$(scripts/check-msrv-features.sh --print-toolchain)
          echo "MSRV_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          rustup toolchain install "$toolchain" --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv-windows
      - run: cargo +"$MSRV_TOOLCHAIN" check --workspace --all-features --locked

  gate:
    name: Gate
    if: always()
    needs: [rust, policy, msrv, msrv-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when any job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | grep -Eq '"result": "(failure|cancelled)"' && exit 1 || exit 0
