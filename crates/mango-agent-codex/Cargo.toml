[package]
name = "mango-agent-codex"
version.workspace = true
authors.workspace = true
categories = ["development-tools", "asynchronous"]
edition.workspace = true
homepage.workspace = true
keywords = ["mangostudio", "agents", "codex", "harness"]
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "OpenAI Codex harness for mango-external-agents: the app-server JSON-RPC dialect"

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
http = "1.4.0"
mango-external-agents = { workspace = true, features = ["stdio"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
mango-external-agents = { workspace = true, features = ["launcher-tokio", "stdio", "testing"] }
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt-multi-thread", "test-util"] }

[package.metadata.docs.rs]
all-features = true
