[package]
name = "mango-agent-codex"
version.workspace = true
authors.workspace = true
categories = ["development-tools", "asynchronous"]
edition.workspace = true
homepage.workspace = true
keywords = ["mangostudio", "agents", "codex", "harness"]
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "OpenAI Codex harness for mango-external-agents: the app-server JSON-RPC dialect"

[lints]
workspace = true

[lib]
# The library has no benchmarks of its own, so `cargo bench` skips its unit tests.
bench = false

[features]
default = []
# The version-answering launcher, for hosts testing against injected fake processes.
testing = ["mango-external-agents/testing"]

[dependencies]
async-trait.workspace = true
http.workspace = true
mango-external-agents = { workspace = true, features = ["stdio"] }
# HMAC-SHA256 for the host-keyed account fingerprint, from the crypto the core already ships: TLS
# is `ring` everywhere in this workspace.
ring = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
mango-external-agents = { workspace = true, features = ["launcher-tokio", "stdio", "testing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

# Non-gating benchmarks: a plain `harness = false` binary with no extra dependencies. Run it with
# `cargo bench -p mango-agent-codex`; see docs/benchmarks.md.
[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "activity"
harness = false

[package.metadata.docs.rs]
all-features = true
