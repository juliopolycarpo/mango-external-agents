[package]
name = "mango-agent-acp"
version.workspace = true
authors.workspace = true
categories = ["development-tools", "asynchronous"]
edition.workspace = true
homepage.workspace = true
keywords = ["mangostudio", "agents", "acp", "harness"]
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "Generic Agent Client Protocol harness for mango-external-agents with per-agent profiles"

[lints]
workspace = true

[lib]
# The library has no benchmarks of its own, so `cargo bench` skips its unit tests.
bench = false

[features]
default = []
# The named fake ACP agent this crate's own tests replay, for a host writing tests of its own.
testing = ["mango-external-agents/testing"]

# Driven end to end against the fake agent, which only exists under `testing`. Declared so the
# `--no-default-features` lane skips the target instead of failing to resolve the import.
[[test]]
name = "session"
path = "tests/session.rs"
required-features = ["testing"]

[dependencies]
# The ACP wire types and method names, and nothing else of the official SDK: the connection is
# the core crate's own JSON-RPC peer. ACP v1 only. Every `unstable_*` feature stays off, so the
# wire this crate speaks is the one agentclientprotocol.com documents as stable, and so do
# `schemars` and `tracing`, which nothing here uses. Pinned exactly: a schema release can reshape
# a type, and the fixtures are captured against this one.
agent-client-protocol-schema = { version = "=1.11.0", default-features = false }
async-trait = "0.1.92"
base64 = { version = "0.22", default-features = false, features = ["std"] }
chrono = { version = "0.4.44", default-features = false, features = ["std"] }
http = "1.4.0"
mango-external-agents.workspace = true
# The bounds on the request and response types a caller hands the connection. No derive here: the
# schema crate owns every wire type.
serde = { version = "1.0.229", default-features = false, features = ["std"] }
# The fake agent composes the v1 wire as JSON rather than as Rust values, so a schema reshape shows
# up as a test that stops matching rather than one that compiles against a wire nobody speaks.
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
tokio = { version = "1.53.3", default-features = false, features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
async-trait = "0.1.92"
mango-external-agents = { workspace = true, features = ["launcher-tokio", "testing"] }
tokio = { version = "1.53.3", default-features = false, features = ["macros", "rt-multi-thread", "test-util"] }

# Non-gating benchmarks: a plain `harness = false` binary with no extra dependencies. Run it with
# `cargo bench -p mango-agent-acp`; see docs/benchmarks.md.
[[bench]]
name = "reducer"
harness = false

[[bench]]
name = "prompt"
harness = false
required-features = ["testing"]

[package.metadata.docs.rs]
all-features = true
