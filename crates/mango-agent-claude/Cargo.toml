[package]
name = "mango-agent-claude"
version.workspace = true
authors.workspace = true
categories = ["development-tools", "asynchronous"]
edition.workspace = true
homepage.workspace = true
keywords = ["mangostudio", "agents", "claude", "harness"]
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "Claude Code harness for mango-external-agents: the stream-json dialect over stdio"

[lints]
workspace = true

[lib]
# The library has no benchmarks of its own, so `cargo bench` skips its unit tests.
bench = false

[dependencies]
# `stdio` because this dialect is a child process per turn and per probe; the
# core's other transport kinds are not reachable from it.
mango-external-agents = { workspace = true, features = ["stdio"] }

async-trait.workspace = true
# `--session-id` takes a UUID and nothing else, so the harness mints one rather than reusing the
# host's own session id, which has no shape requirement. The sixteen random bytes come from the
# crypto the core already ships: TLS is `ring` everywhere in this workspace.
ring = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["fs", "macros", "rt", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
# Read the effective uid without an unsafe libc call when validating a host scratch root.
nix = { workspace = true, features = ["user"] }

[dev-dependencies]
mango-external-agents = { workspace = true, features = ["stdio", "testing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

# Non-gating benchmarks: a plain `harness = false` binary with no extra dependencies. Run it with
# `cargo bench -p mango-agent-claude`; see docs/benchmarks.md.
[[bench]]
name = "tool_results"
harness = false

[package.metadata.docs.rs]
all-features = true
