[package]
name = "mango-external-agents"
version.workspace = true
authors.workspace = true
categories = ["development-tools", "asynchronous"]
edition.workspace = true
homepage.workspace = true
keywords = ["mangostudio", "agents", "claude-code", "codex", "acp"]
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "Drive local coding-agent CLIs from Rust behind one abstraction: transport kind x harness kind"

[lints]
workspace = true

[lib]
# The library has no benchmarks of its own, so `cargo bench` skips its unit tests.
bench = false

[features]
default = ["stdio"]
# Line-framed child processes spawned through the host's ProcessLauncher.
stdio = []
# A dialled WebSocket URL (tokio-tungstenite over ring).
websocket = ["dep:futures-util", "dep:rustls", "dep:tokio-tungstenite", "tokio/net"]
# A default ProcessLauncher on tokio::process for hosts without their own spawner.
launcher-tokio = [
  "dep:nix",
  "dep:process-wrap",
  "dep:win32job",
  "dep:windows",
  "tokio/io-util",
  "tokio/process",
]
# FakeLauncher, FakeHarness, ScriptedLink and the harness conformance cases.
testing = []

[dependencies]
async-trait.workspace = true
ring = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

futures-util = { workspace = true, features = ["sink"], optional = true }
# TLS is `ring` everywhere: named here with no default features, so the provider is this crate's
# choice rather than whatever a transitive default would have picked.
rustls = { workspace = true, features = ["logging", "ring", "std", "tls12"], optional = true }
tokio-tungstenite = { workspace = true, features = ["connect", "handshake", "rustls-tls-native-roots"], optional = true }

# Signals for the default launcher's escalation. `unsafe_code` is forbidden in this workspace, so
# the process-group signal goes through a safe binding rather than a raw `libc::kill`.
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["process", "signal"], optional = true }

# Windows jobs provide containment that a child PID cannot: a process is suspended before the
# outer Job owns it, and resumed only after the inner Job is ready. The outer Job's safe process
# list proves it is empty, so a leader's exit cannot make a surviving helper look reaped.
[target.'cfg(windows)'.dependencies]
process-wrap = { workspace = true, features = ["creation-flags", "job-object", "kill-on-drop", "tokio1"], optional = true }
win32job = { workspace = true, optional = true }
windows = { workspace = true, features = ["Win32_System_Threading"], optional = true }

[dev-dependencies]
# The oracle for `http_endpoint`: tests compare validation with the former harness parser.
http.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "test-util"] }

# Non-gating benchmarks: plain `harness = false` binaries with no extra dependencies. Run them with
# `cargo bench -p mango-external-agents`; see docs/benchmarks.md.
[[bench]]
name = "framing"
harness = false

[[bench]]
name = "events"
harness = false

[[bench]]
name = "redact"
harness = false

[[bench]]
name = "copies"
harness = false
required-features = ["stdio"]

[[bench]]
name = "discovery"
harness = false

[package.metadata.docs.rs]
all-features = true
