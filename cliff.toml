# git-cliff configuration — https://git-cliff.org
# Generates CHANGELOG.md from Conventional Commits. Driven by `scripts/changelog.sh`
# (git-cliff, installed locally or through CI); never edit CHANGELOG.md by hand.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.
The format is based on [Keep a Changelog](https://keepachangelog.com), and this
project adheres to [Semantic Versioning](https://semver.org).
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}[**breaking**] {% endif %}\
{% if commit.scope %}**({{ commit.scope }})** {% endif %}\
{{ commit.message | split(pat="\n") | first | upper_first }}\
{% endfor %}
{% endfor %}
"""
footer = ""
# false, not true: trimming each rendered section strips the newline that separates one version's
# last entry from the next version's heading, which glues `## [0.1.0]` onto a bullet the moment the
# file holds two releases. The header therefore ends without its own blank line, so that the one
# the body carries is the only one between it and the first heading.
trim = false
# Group headers carry a sortable HTML comment for ordering; strip it from output.
postprocessors = [{ pattern = '<!-- [0-9]+ -->', replace = "" }]

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_preprocessors = []
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^Initial commit", skip = true },
  { message = "^chore\\(deps\\)", group = "<!-- 08 -->⬆️ Dependencies" },
  { message = "^build\\(deps\\)", group = "<!-- 08 -->⬆️ Dependencies" },
  { message = "^feat", group = "<!-- 00 -->🚀 Features" },
  { message = "^fix", group = "<!-- 01 -->🐛 Bug Fixes" },
  { message = "^perf", group = "<!-- 02 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 03 -->♻️ Refactor" },
  { message = "^security", group = "<!-- 04 -->🔒 Security" },
  { message = "^migration", group = "<!-- 05 -->🛢️ Migrations" },
  { message = "^docs", group = "<!-- 06 -->📚 Documentation" },
  { message = "^test", group = "<!-- 07 -->🧪 Testing" },
  { message = "^ci", group = "<!-- 09 -->👷 CI" },
  { message = "^build", group = "<!-- 10 -->🏗️ Build" },
  { message = "^style", group = "<!-- 11 -->🎨 Styling" },
  { message = "^chore", group = "<!-- 12 -->🧹 Miscellaneous" },
  { message = "^revert", group = "<!-- 13 -->◀️ Revert" },
  { body = ".*", group = "<!-- 14 -->Other" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "newest"
