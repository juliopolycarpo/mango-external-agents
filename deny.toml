# cargo-deny policy — https://embarkstudios.github.io/cargo-deny/
# Checked by `cargo deny check` in CI and in scripts/check.sh.

[graph]
# Every target the release plans build; bans are checked against all of them so a
# target-specific dependency (rustls picking aws-lc-rs on one triple) still trips.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]
all-features = true

[output]
feature-depth = 1

[advisories]
version = 2
db-path = "$CARGO_HOME/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow-wildcard-paths = true
# TLS is `ring` everywhere: aws-lc-rs breaks aarch64 Windows and old cross-gcc builds, and
# openssl drags a system library into a crate that must build from `cargo install`.
deny = [
  { crate = "openssl", reason = "TLS is ring; no system OpenSSL" },
  { crate = "openssl-sys", reason = "TLS is ring; no system OpenSSL" },
  { crate = "aws-lc-rs", reason = "TLS is ring; aws-lc-rs fails on aarch64-pc-windows-msvc" },
  { crate = "aws-lc-sys", reason = "TLS is ring; aws-lc-rs fails on aarch64-pc-windows-msvc" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
