# cargo-deny policy — https://embarkstudios.github.io/cargo-deny/
# Checked by `cargo deny check -D unmatched-skip -D unnecessary-skip` in CI and scripts/check.sh.

[graph]
# Every target the release plans build; bans are checked against all of them so a
# target-specific dependency (rustls picking aws-lc-rs on one triple) still trips.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]
all-features = true

[output]
feature-depth = 1

[advisories]
version = 2
db-path = "$CARGO_HOME/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8
exceptions = []
# An allowance nothing in the graph needs is an allowance nobody reviewed: it would let the first
# crate under that licence in without a diff to this file.
unused-allowed-license = "deny"

[licenses.private]
ignore = true

[bans]
# A second version of a crate is a second copy to build, audit and ship. Each one that cannot be
# removed from here is named in `skip` below with who brings it, so a new one fails the check
# instead of joining a list of warnings nobody reads.
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow-wildcard-paths = true
# TLS is `ring` everywhere: aws-lc-rs breaks aarch64 Windows and old cross-gcc builds, and
# openssl drags a system library into a crate that must build from `cargo install`.
deny = [
  { crate = "openssl", reason = "TLS is ring; no system OpenSSL" },
  { crate = "openssl-sys", reason = "TLS is ring; no system OpenSSL" },
  { crate = "aws-lc-rs", reason = "TLS is ring; aws-lc-rs fails on aarch64-pc-windows-msvc" },
  { crate = "aws-lc-sys", reason = "TLS is ring; aws-lc-rs fails on aarch64-pc-windows-msvc" },
  # ACP runs on this workspace's own JSON-RPC peer. Only the schema crate of the official SDK is
  # a dependency, for the wire types; the SDK's connection and what it brought with it stay out.
  { crate = "agent-client-protocol", reason = "ACP uses the in-house JSON-RPC peer; depend on agent-client-protocol-schema for wire types" },
  { crate = "futures-concurrency", reason = "came in only with agent-client-protocol; the JSON-RPC peer runs on tokio" },
  # The SDK's process spawner and stdio adapter pulled these in. The host owns the process, the
  # pipes and the runtime, so nothing here may bring a second executor.
  { crate = "async-io", reason = "the host owns the runtime; no second reactor" },
  { crate = "async-process", reason = "the host owns the process; the library never spawns" },
  { crate = "blocking", reason = "the host owns the pipes; no blocking thread pool" },
]
# The older of each pair, by major line, so a patch release of the same line does not need an edit
# here. Remove an entry when the crate that brings it moves on; the gates deny skips that match
# nothing or a crate with only one version.
skip = [
  { crate = "getrandom@0.2", reason = "ring 0.17 requires getrandom 0.2; other consumers, including rand and tempfile, require 0.4" },
  { crate = "windows-sys@0.52", reason = "ring 0.17 is on windows-sys 0.52; tokio, mio and rustix are on 0.61" },
  { crate = "thiserror@1", reason = "win32job 2 is on thiserror 1; tungstenite is on 2" },
  { crate = "thiserror-impl@1", reason = "the derive half of thiserror 1, for win32job 2" },
  { crate = "syn@2", reason = "derive_more and strum (the ACP schema crate), thiserror 1 and the windows macros are on syn 2; the rest are on 3" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
