[workspace]
resolver = "3"
members = ["crates/*", "examples/hub-host", "examples/mea"]

[workspace.package]
version = "0.3.0"
authors = ["Julio Polycarpo"]
edition = "2024"
homepage = "https://mangostudio.dev"
license = "MIT"
repository = "https://github.com/juliopolycarpo/mango-external-agents"
rust-version = "1.96"

# Lockstep: every crate takes its version from [workspace.package] and every
# in-workspace dependency is declared here once, so a release bump touches one
# number. scripts/check-versions.sh enforces it.
[workspace.dependencies]
mango-agent-acp = { path = "crates/mango-agent-acp", version = "0.3.0", default-features = false }
mango-agent-claude = { path = "crates/mango-agent-claude", version = "0.3.0", default-features = false }
mango-agent-codex = { path = "crates/mango-agent-codex", version = "0.3.0", default-features = false }
mango-external-agents = { path = "crates/mango-external-agents", version = "0.3.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
